<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecondBrain - Total Knowledge & Memory Graph</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #0e1417;
      --card-bg: rgba(18, 25, 29, 0.94);
      --border: rgba(166, 195, 195, 0.2);
      --accent: #cf6b42;
      --accent-soft: #e8ae88;
      --cyan: #a6c3c3;
      --luna: #a87ffb;
      --text: #e7e3d8;
      --text-muted: #839695;
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    #canvas:active {
      cursor: grabbing;
    }
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      box-shadow: 0 10px 35px 0 rgba(0, 0, 0, 0.55);
    }
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(166, 195, 195, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body class="w-full h-full relative">

  <!-- Canvas Graph View -->
  <canvas id="canvas"></canvas>

    <button id="zoomOut" class="w-8 h-8 rounded-lg flex items-center justify-center text-[#e7e3d8] hover:bg-white/10 text-base font-bold transition">&minus;</button>

    <button id="resetView" class="w-8 h-8 rounded-lg flex items-center justify-center text-[#e7e3d8] hover:bg-white/10 text-xs font-mono transition" title="Reset View">&#x27F3;</button>

      height = window.innerHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    const nodeMap = new Map();
    NODES.forEach((n, i) => {
      const angle = (i / NODES.length) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
      const isCoreTrio = n.id === "heru" || n.id === "ai" || n.id === "luna" || n.id === "secondbrain_hub";
      const dist = isCoreTrio ? 55 + Math.random() * 45 : 160 + Math.random() * 230;
      n.x = (width / 2) + Math.cos(angle) * dist;
      n.y = (height / 2) + Math.sin(angle) * dist;
      n.vx = 0;
      n.vy = 0;
      n.visible = true;
      nodeMap.set(n.id, n);
    });

    const resolvedLinks = LINKS.map(l => ({
      source: nodeMap.get(l.source),
      target: nodeMap.get(l.target),
      label: l.label,
      targetDist: (l.source.cat === "identity" || l.source.cat === "luna") && (l.target.cat === "identity" || l.target.cat === "luna") ? 100 : 135
    })).filter(l => l.source && l.target);

    const camera = { x: 0, y: 0, zoom: 0.95, targetZoom: 0.95 };
    let hoveredNode = null, selectedNode = null, draggedNode = null;
    let isPanning = false, panStart = { x: 0, y: 0 };
    let currentFilter = "all", searchQuery = "";
    let isPhysicsActive = true;

    function updatePhysics() {
      if (!isPhysicsActive) {
        camera.zoom += (camera.targetZoom - camera.zoom) * 0.15;
        return;
      }

      const repulsion = 640;
      const springK = 0.027;
      const centerGravity = 0.007;
      const damping = 0.83;

      const visible = NODES.filter(n => n.visible);

      // Repulsion
      for (let i = 0; i < visible.length; i++) {
        const a = visible[i];
        for (let j = i + 1; j < visible.length; j++) {
          const b = visible[j];
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let dist = Math.sqrt(dx * dx + dy * dy) || 1;
          if (dist < 380) {
            let force = (repulsion / (dist * dist)) * 26;
            let fx = (dx / dist) * force;
            let fy = (dy / dist) * force;
            a.vx -= fx;
            a.vy -= fy;
            b.vx += fx;
            b.vy += fy;
          }
        }
      }

      // Spring Links
      for (const l of resolvedLinks) {
        if (!l.source.visible || !l.target.visible) continue;
        let dx = l.target.x - l.source.x;
        let dy = l.target.y - l.source.y;
        let dist = Math.sqrt(dx * dx + dy * dy) || 1;
        let force = (dist - l.targetDist) * springK;
        let fx = (dx / dist) * force;
        let fy = (dy / dist) * force;
        l.source.vx += fx;
        l.source.vy += fy;
        l.target.vx -= fx;
        l.target.vy -= fy;
      }

      // Center Gravity & Damping
      const cx = width / 2;
      const cy = height / 2;
      for (const n of visible) {
        if (n === draggedNode) continue;
        n.vx += (cx - n.x) * centerGravity;
        n.vy += (cy - n.y) * centerGravity;
        n.vx *= damping;
        n.vy *= damping;
        n.x += n.vx;
        n.y += n.vy;
      }

      camera.zoom += (camera.targetZoom - camera.zoom) * 0.15;
    }

    function render() {
      updatePhysics();

      ctx.clearRect(0, 0, width, height);
      ctx.save();
      ctx.translate(width / 2 + camera.x, height / 2 + camera.y);
      ctx.scale(camera.zoom, camera.zoom);
      ctx.translate(-width / 2, -height / 2);

      // Subtle celestial background grid
      ctx.strokeStyle = "rgba(166, 195, 195, 0.035)";
      ctx.lineWidth = 1;
      const gridSize = 45;
      const startX = Math.floor((-width) / gridSize) * gridSize;
      const endX = Math.ceil((width * 2) / gridSize) * gridSize;
      const startY = Math.floor((-height) / gridSize) * gridSize;
      const endY = Math.ceil((height * 2) / gridSize) * gridSize;
      ctx.beginPath();
      for (let x = startX; x <= endX; x += gridSize) {
        ctx.moveTo(x, startY);
        ctx.lineTo(x, endY);
      }
      for (let y = startY; y <= endY; y += gridSize) {
        ctx.moveTo(startX, y);
        ctx.lineTo(endX, y);
      }
      ctx.stroke();

      // Render Links
      for (const l of resolvedLinks) {
        if (!l.source.visible || !l.target.visible) continue;

        const isHighlighted = (hoveredNode && (l.source === hoveredNode || l.target === hoveredNode)) ||
                              (selectedNode && (l.source === selectedNode || l.target === selectedNode));
        
        ctx.beginPath();
        ctx.moveTo(l.source.x, l.source.y);
        ctx.lineTo(l.target.x, l.target.y);

        if (isHighlighted) {
          const isLunaLink = l.source.cat === "luna" || l.target.cat === "luna";
          ctx.strokeStyle = isLunaLink ? "#a87ffb" : "#cf6b42";
          ctx.lineWidth = 2.5;
        } else if (hoveredNode || selectedNode) {
          ctx.strokeStyle = "rgba(166, 195, 195, 0.08)";
          ctx.lineWidth = 1;
        } else {
          const isLunaLink = l.source.cat === "luna" || l.target.cat === "luna";
          ctx.strokeStyle = isLunaLink ? "rgba(168, 127, 251, 0.28)" : "rgba(166, 195, 195, 0.2)";
          ctx.lineWidth = 1.2;
        }
        ctx.stroke();

        if (isHighlighted && l.label) {
          const midX = (l.source.x + l.target.x) / 2;
          const midY = (l.source.y + l.target.y) / 2;
          ctx.font = "9.5px monospace";
          ctx.fillStyle = l.source.cat === "luna" || l.target.cat === "luna" ? "#c4b5fd" : "#e8ae88";
          ctx.textAlign = "center";
          ctx.fillText(l.label, midX, midY - 5);
        }
      }

      // Render Nodes
      for (const n of NODES) {
        if (!n.visible) continue;

        const isHovered = n === hoveredNode;
        const isSelected = n === selectedNode;
        const isNeighbor = (hoveredNode && resolvedLinks.some(l => (l.source === hoveredNode && l.target === n) || (l.target === hoveredNode && l.source === n))) ||
                           (selectedNode && resolvedLinks.some(l => (l.source === selectedNode && l.target === n) || (l.target === selectedNode && l.source === n)));

        const active = isHovered || isSelected || isNeighbor;
        const dim = (hoveredNode || selectedNode) && !active;

        const cat = CATEGORIES[n.cat] || CATEGORIES.identity;
        const radius = n.radius * (isHovered || isSelected ? 1.25 : 1);

        if (isHovered || isSelected) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, radius + 8, 0, Math.PI * 2);
          ctx.fillStyle = cat.color + "38";
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = dim ? "rgba(38, 48, 52, 0.45)" : cat.color;
        ctx.fill();
        ctx.lineWidth = isHovered || isSelected ? 3 : 1.5;
        ctx.strokeStyle = dim ? "rgba(166, 195, 195, 0.15)" : cat.border;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(n.x, n.y, radius * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = dim ? "rgba(255,255,255,0.1)" : "#ffffff";
        ctx.fill();

        ctx.font = (isHovered || isSelected ? "bold 12px" : "10px") + " sans-serif";
        ctx.fillStyle = dim ? "rgba(231, 227, 216, 0.25)" : (isHovered || isSelected ? "#ffffff" : "#e7e3d8");
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(n.label, n.x, n.y + radius + 13);
      }

      ctx.restore();
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    function screenToWorld(sx, sy) {
      const cx = width / 2;
      const cy = height / 2;
      const wx = (sx - cx - camera.x) / camera.zoom + cx;
      const wy = (sy - cy - camera.y) / camera.zoom + cy;
      return { x: wx, y: wy };
    }

    function findNodeAt(sx, sy) {
      const w = screenToWorld(sx, sy);
      for (let i = NODES.length - 1; i >= 0; i--) {
        const n = NODES[i];
        if (!n.visible) continue;
        const dx = w.x - n.x;
        const dy = w.y - n.y;
        if (dx * dx + dy * dy <= (n.radius + 6) * (n.radius + 6)) return n;
      }
      return null;
    }

    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      if (draggedNode) {
        const w = screenToWorld(mx, my);
        draggedNode.x = w.x;
        draggedNode.y = w.y;
        draggedNode.vx = 0;
        draggedNode.vy = 0;
        return;
      }

      if (isPanning) {
        camera.x += mx - panStart.x;
        camera.y += my - panStart.y;
        panStart = { x: mx, y: my };
        return;
      }

      const node = findNodeAt(mx, my);
      if (node !== hoveredNode) {
        hoveredNode = node;
        canvas.style.cursor = hoveredNode ? "pointer" : "grab";
      }
    });

    canvas.addEventListener("mousedown", (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const node = findNodeAt(mx, my);

      if (node) {
        draggedNode = node;
        selectNode(node);
      } else {
        isPanning = true;
        panStart = { x: mx, y: my };
        canvas.style.cursor = "grabbing";
      }
    });

    window.addEventListener("mouseup", () => {
      draggedNode = null;
      if (isPanning) {
        isPanning = false;
        canvas.style.cursor = hoveredNode ? "pointer" : "grab";
      }
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.14 : 0.86;
      camera.targetZoom = Math.max(0.3, Math.min(3.5, camera.targetZoom * factor));
    }, { passive: false });

    function selectNode(node) {
      selectedNode = node;
      const inspector = document.getElementById("inspector");
      const badge = document.getElementById("nodeCategoryBadge");
      const title = document.getElementById("nodeTitle");
      const subtitle = document.getElementById("nodeSubtitle");
      const desc = document.getElementById("nodeDesc");
      const connList = document.getElementById("nodeConnections");
      const connCount = document.getElementById("connectionCount");

      const cat = CATEGORIES[node.cat] || CATEGORIES.identity;
      badge.textContent = cat.name;
      badge.style.borderColor = cat.border;
      badge.style.color = cat.border;

      title.textContent = node.label;
      subtitle.textContent = node.path;
      desc.textContent = node.desc;

      const conns = resolvedLinks.filter(l => l.source === node || l.target === node);
      connCount.textContent = conns.length;
      connList.innerHTML = "";

      conns.forEach(l => {
        const other = l.source === node ? l.target : l.source;
        const item = document.createElement("button");
        item.className = "flex items-center justify-between text-left p-2.5 rounded-lg bg-white/5 hover:bg-white/10 text-xs transition border border-white/5";
        item.innerHTML = `
          <div class="flex items-center gap-2 truncate">
            <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${(CATEGORIES[other.cat]||CATEGORIES.identity).color}"></span>
            <span class="text-[#e7e3d8] truncate font-medium">${other.label}</span>
          </div>
          <span class="text-[10px] font-mono text-[#839695] pl-2">${l.label || "Relasi"}</span>
        `;
        item.onclick = () => {
          selectNode(other);
          focusOnNode(other);
        };
        connList.appendChild(item);
      });

      inspector.classList.remove("translate-x-full");
    }

    document.getElementById("closeInspector").onclick = () => {
      document.getElementById("inspector").classList.add("translate-x-full");
      selectedNode = null;
    };

    function focusOnNode(node) {
      const cx = width / 2;
      const cy = height / 2;
      camera.x = cx - node.x;
      camera.y = cy - node.y;
      camera.targetZoom = 1.35;
    }

    document.getElementById("focusNodeBtn").onclick = () => {
      if (selectedNode) focusOnNode(selectedNode);
    };

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".filter-btn").forEach(b => {
          b.classList.remove("border-[#cf6b42]", "text-[#e7e3d8]");
          b.classList.add("text-[#839695]");
        });
        btn.classList.add("border-[#cf6b42]", "text-[#e7e3d8]");
        btn.classList.remove("text-[#839695]");

        currentFilter = btn.dataset.cat;
        applyFilters();
      };
    });

    const searchInput = document.getElementById("searchInput");
    const clearSearch = document.getElementById("clearSearch");
    searchInput.oninput = (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      clearSearch.classList.toggle("hidden", searchQuery === "");
      applyFilters();
    };

    clearSearch.onclick = () => {
      searchInput.value = "";
      searchQuery = "";
      clearSearch.classList.add("hidden");
      applyFilters();
    };

    function applyFilters() {
      NODES.forEach(n => {
        const matchesCat = currentFilter === "all" || n.cat === currentFilter || (currentFilter === "identity" && n.cat === "luna");
        const matchesSearch = searchQuery === "" || 
                              n.label.toLowerCase().includes(searchQuery) || 
                              n.path.toLowerCase().includes(searchQuery) ||
                              n.desc.toLowerCase().includes(searchQuery);
        n.visible = matchesCat && matchesSearch;
      });
    }

    document.getElementById("zoomIn").onclick = () => {
      camera.targetZoom = Math.min(3.5, camera.targetZoom * 1.3);
    };
    document.getElementById("zoomOut").onclick = () => {
      camera.targetZoom = Math.max(0.3, camera.targetZoom * 0.7);
    };
    document.getElementById("togglePhysics").onclick = () => {
      isPhysicsActive = !isPhysicsActive;
      document.getElementById("togglePhysics").innerHTML = isPhysicsActive ? "&#x23F8;" : "&#x25B6;";
    };
    document.getElementById("resetView").onclick = () => {
      camera.x = 0;
      camera.y = 0;
      camera.targetZoom = 0.95;
      NODES.forEach(n => {
        n.vx += (Math.random() - 0.5) * 4;
        n.vy += (Math.random() - 0.5) * 4;
      });
    };
  </script>
</body>
</html>
